</g>
<circle class="eye" cx="26.0542" cy="19.2716" r="1.76049" fill="white"/>
<circle class="eye" cx="33.6521" cy="19.2716" r="1.76049" fill="white"/>
<rect x="23.8022" y="13.9991" width="3.54428" height="1" rx="0.5" transform="rotate(27.3461 23.8022 13.9991)" fill="white"/>
<rect x="31.7063" y="15.8914" width="4.11588" height="1" rx="0.5" transform="rotate(-32.8812 31.7063 15.8914)" fill="white"/>
