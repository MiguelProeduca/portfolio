<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.eye { transform-box: fill-box; transform-origin: center; animation: expression 12s ease-in-out infinite; }
.mouth { transform-box: fill-box; transform-origin: center; animation: laugh 12s ease-in-out infinite; }
.face { transform-origin: 28px 28px; animation: chuckle 12s ease-in-out infinite; }
@keyframes expression {
  0%,15%,18%,36%,39%,41%,44%,57%,60%,69%,81%,91%,94%,100% { transform: scaleY(1); }
  16.5%,37.5%,42.5%,58.5%,92.5% { transform: scaleY(.08); }
  71%,79% { transform: scaleY(.22); }
}
@keyframes laugh {
  0%,69%,81%,100% { transform: scale(1); }
  71%,75%,79% { transform: scale(1.065,1.13); }
  73%,77% { transform: scale(1.035,.95); }
}
@keyframes chuckle {
  0%,69%,81%,100% { transform: translateY(0); }
  71%,75%,79% { transform: translateY(-1.1px); }
  73%,77% { transform: translateY(.4px); }
}
@media (prefers-reduced-motion: reduce) { .eye,.mouth,.face { animation: none; } }
</style>
<title>Logo de Miguel con parpadeos y risa</title>
